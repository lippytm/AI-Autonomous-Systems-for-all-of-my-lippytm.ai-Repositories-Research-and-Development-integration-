name: Swarm Hub CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          python -m pip install flake8
          python -m flake8 --max-line-length 120 swarm_hub test_swarm_hub.py
      - name: Unit tests
        run: python -m unittest -v
      - name: Playbook self-test
        run: python -m swarm_hub selftest
