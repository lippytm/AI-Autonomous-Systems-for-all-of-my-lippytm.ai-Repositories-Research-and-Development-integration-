name: AI Autonomous Improvements

# Daily fleet patrol by the swarm hub. Report-only: it reads public CI and PR
# state across the lippytm fleet and uploads a report. It never pushes, merges,
# comments or calls an AI provider.

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patrol:
    name: Fleet patrol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test registry, playbook and prevention rules
        run: |
          mkdir -p reports
          python -m swarm_hub selftest

      - name: Prevention scan (this repo)
        run: python -m swarm_hub prevent | tee reports/prevent.txt

      - name: Auto-fix proposals (dry run, never written)
        run: python -m swarm_hub autofix | tee reports/autofix.diff

      - name: Default-branch CI health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          python -m swarm_hub health | tee reports/health.txt || echo "::warning::Some fleet repositories have failing workflows; see reports/health.txt"

      - name: Pull request triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m swarm_hub prs --json > reports/prs.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-patrol-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
